# Local / staging stack:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
# Not a production definition: devops owns the real one (managed Postgres,
# secrets manager, TLS, scaling). This shows how the pieces connect.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: modenx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: modenx
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modenx"]
      interval: 5s
      retries: 10

  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    depends_on: { db: { condition: service_healthy } }
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg://modenx:${POSTGRES_PASSWORD}@db:5432/modenx
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      MANAGER_EMAILS: ${MANAGER_EMAILS:-}
      MANAGER_GROUP_ID: ${MANAGER_GROUP_ID:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      DEV_LOGIN: ${DEV_LOGIN:-false}

  frontend:
    build: { context: .., dockerfile: deploy/Dockerfile.frontend }

  proxy:
    image: nginx:1.27-alpine
    depends_on: [backend, frontend]
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]

volumes:
  dbdata:
