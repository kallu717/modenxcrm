# Reverse proxy sample: ONE public address in front of both services, so the
# browser sees a single origin and the sign-in cookie just works (no CORS).
# TLS is the proxy's job: terminate HTTPS here (or at your load balancer) and
# set COOKIE_SECURE=true on the API.
events {}

http {
  upstream api { server backend:8000; }
  upstream web { server frontend:3000; }

  server {
    listen 80;   # devops: listen 443 ssl; with your certificate in production
    client_max_body_size 5m;

    # Python API, Entra sign-in routes, machine import
    location ~ ^/(api|auth|ingest|healthz) {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Next.js front end
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
